# /etc/postgresql/18/main/conf.d/90-cactus-same-box.conf
#
# Postgres sharing a 32 GB box with the sites it serves. Roughly an eighth of memory
# for shared_buffers, leaving the rest for the sites, their builds and the page cache.
# Halve the memory figures on a 16 GB box.

listen_addresses = 'localhost'
max_connections = 100

shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 16MB
maintenance_work_mem = 512MB
wal_buffers = 16MB

# NVMe: random reads cost about the same as sequential ones.
random_page_cost = 1.1
effective_io_concurrency = 200

# JIT costs more than it saves on the short queries a website makes.
jit = off

shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
log_min_duration_statement = 1000
log_temp_files = 10MB

# A transaction left open by a crashed request should not hold locks for ever.
idle_in_transaction_session_timeout = 60s
