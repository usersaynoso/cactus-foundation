# Manual deploys: give each site its own name (e.g. cactus-media-example-com). A Worker
# holds one site's storage keys and origin, so two sites must never share one.
name = "cactus-media-worker"
main = "index.ts"
compatibility_date = "2024-01-01"

[build]
command = "npx tsc --noEmit && echo 'Types OK'"

# Secrets are added via: wrangler secret put <SECRET_NAME>
# Required secrets:
#   B2_APPLICATION_KEY_ID
#   B2_APPLICATION_KEY
#   B2_BUCKET_NAME
#   B2_ENDPOINT
#   ALLOWED_ORIGIN
